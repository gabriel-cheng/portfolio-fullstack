services:
  postgres:
    image: postgres:17
    container_name: portfolio-fullstack
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-portfolio}
      POSTGRES_USER: ${DATABASE_USERNAME:-portfolio}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-portfolio_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
