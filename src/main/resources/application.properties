spring.config.import=optional:file:.env[.properties]
spring.application.name=portfolio

# Bootstrap do administrador inicial
app.bootstrap-admin.username=${ADMIN_USERNAME:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio-fullstack
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=10h
app.jwt.cookie-name=auth_token
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}